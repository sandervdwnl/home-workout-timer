<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Bouw je workout met blokken en train met bel en afcount." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Workout Timer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #f1f5f9;
        background: #020617;
      }
      body { min-height: 100vh; }
      button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; -webkit-tap-highlight-color: transparent; }
      input, textarea { font: inherit; }
      .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
      .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin: 16px 0 20px; }
      h1 { font-size: 24px; }
      .sub { color: #94a3b8; font-size: 13px; margin-top: 2px; }
      .btn { display: inline-flex; align-items: center; gap: 6px; background: #34d399; color: #020617; font-weight: 700; padding: 10px 14px; border-radius: 12px; }
      .btn:disabled { opacity: .3; }
      .btn svg { width: 15px; height: 15px; }
      .wcard { display: flex; align-items: center; gap: 8px; background: #1e293bb3; border: 1px solid #334155; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
      .wname { flex: 1; min-width: 0; text-align: left; }
      .wname .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
      .wname .meta { color: #94a3b8; font-size: 12px; margin-top: 3px; }
      .playbtn { background: #34d399; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #020617; flex-shrink: 0; }
      .playbtn svg { width: 20px; height: 20px; }
      .ibtn { padding: 8px; border-radius: 10px; color: #94a3b8; display: inline-flex; }
      .ibtn:hover { background: #334155; color: #f1f5f9; }
      .ibtn:disabled { opacity: .25; }
      .ibtn svg { width: 16px; height: 16px; display: block; }
      .empty { border: 1px dashed #334155; border-radius: 12px; padding: 24px; text-align: center; color: #94a3b8; font-size: 14px; }
      .topbar { position: sticky; top: 0; z-index: 5; background: rgba(2, 6, 23, .95); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; }
      .topbar .in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
      .winput { flex: 1; min-width: 0; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 9px 12px; font-weight: 600; color: #f1f5f9; outline: none; }
      .winput:focus { border-color: #34d399; }
      .stats { display: flex; justify-content: space-between; gap: 8px; background: rgba(30, 41, 59, .6); border-radius: 12px; padding: 8px 12px; font-size: 12px; color: #cbd5e1; margin-bottom: 14px; }
      .stats b { color: #6ee7b7; font-variant-numeric: tabular-nums; }
      .stats .r { color: #94a3b8; text-align: right; }
      .block { border-radius: 12px; border: 1px solid #334155; background: rgba(30, 41, 59, .7); padding: 8px; margin-bottom: 8px; }
      .block.round { border-color: rgba(99, 102, 241, .6); background: rgba(30, 27, 75, .4); }
      .card-top { display: flex; align-items: center; gap: 6px; }
      .card-top .bname { margin-right: 4px; }
      .badge { font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
      .badge.ex { background: rgba(52, 211, 153, .2); color: #6ee7b7; }
      .badge.rd { background: rgba(99, 102, 241, .3); color: #a5b4fc; }
      .bname { flex: 1; min-width: 0; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 6px 8px; color: #f1f5f9; outline: none; font-size: 14px; resize: none; line-height: 1.4; min-height: 36px; }
      .bname:focus { border-color: #34d399; }
      .card-bot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: 4px; }
      .fields { display: flex; flex-wrap: wrap; gap: 8px; }
      .round-fields { width: 100%; }
      .round-row { display: flex; gap: 8px; }
      .field { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .flabel { font-size: 9px; color: #94a3b8; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
      .stepper { display: flex; gap: 4px; }
      .stepper button { width: 36px; height: 36px; background: #334155; border-radius: 8px; font-size: 18px; font-weight: 800; color: #f1f5f9; user-select: none; touch-action: manipulation; }
      .stepper button:active { background: #475569; }
      .stepper input { width: 42px; height: 36px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; text-align: center; font-size: 16px; font-weight: 800; color: #f1f5f9; outline: none; -moz-appearance: textfield; }
      .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      .moves { display: flex; gap: 4px; padding-bottom: 4px; }
      .moves .ibtn { padding: 8px; }
      .moves .ibtn:last-child { margin-left: 4px; }
      .card-top .ibtn { padding: 6px; }
      .card-top .del-btn { margin-left: 2px; }
      .adds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
      .add { border: 1px dashed; border-radius: 12px; padding: 12px; font-weight: 600; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 6px; }
      .add.ex { border-color: rgba(52, 211, 153, .6); color: #6ee7b7; }
      .add.rd { border-color: rgba(129, 140, 248, .6); color: #a5b4fc; }
      .add svg { width: 14px; height: 14px; }
      .adds.inline { display: flex; gap: 8px; margin: 8px 0 0 34px; flex-wrap: wrap; }
      .adds.inline .add { flex: 1; min-width: 140px; }
      .adds.inline .ibtn { padding: 8px; }
      .addContainer { margin-bottom: 12px; }
      .hint { background: rgba(30, 41, 59, .4); border-radius: 12px; padding: 12px; font-size: 12px; line-height: 1.6; color: #94a3b8; margin-top: 14px; }
      .hint b { color: #e2e8f0; }
      .pvhead { flex: 1; min-width: 0; }
      .pvhead .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pvhead .meta { color: #94a3b8; font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pv { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
      .pv-round { display: flex; align-items: center; gap: 8px; background: rgba(30, 27, 75, .5); border: 1px solid rgba(99, 102, 241, .6); border-radius: 12px; padding: 10px 12px; margin-top: 6px; }
      .pv .pv-round:first-child { margin-top: 0; }
      .pv-round .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pv-round .mt { color: #a5b4fc; font-size: 12px; white-space: nowrap; }
      .pv-row { display: flex; align-items: center; gap: 8px; background: rgba(30, 41, 59, .5); border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; }
      .pv-row.in { margin-left: 22px; }
      .pv-row::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #34d399; flex-shrink: 0; }
      .pv-row .nm { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pv-row .mt { color: #94a3b8; font-size: 12px; white-space: nowrap; }
      .headbtns { display: flex; align-items: center; gap: 6px; }
      .headbtns .ibtn { padding: 10px; }
      .setgroup { background: rgba(30, 41, 59, .6); border: 1px solid #334155; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
      .settitle { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; }
      .volrow { display: flex; align-items: center; gap: 10px; }
      .volrow input[type="range"] { flex: 1; accent-color: #34d399; }
      .volval { width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: #6ee7b7; }
      .sopts { display: flex; flex-direction: column; gap: 8px; }
      .sopt { display: flex; align-items: center; gap: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
      .sopt .stxt { flex: 1; min-width: 0; }
      .sopt .sn { display: block; font-weight: 600; }
      .sopt .sd { display: block; color: #94a3b8; font-size: 12px; margin-top: 2px; }
      .sopt.sel { border-color: #34d399; background: rgba(52, 211, 153, .12); }
      .sopt .check { color: #34d399; font-weight: 800; flex-shrink: 0; }
      .setrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 2px; text-align: left; }
      .setrow + .setrow { border-top: 1px solid #1e293b; }
      .settxt { flex: 1; min-width: 0; }
      .settxt .l { font-weight: 600; }
      .settxt .d { color: #94a3b8; font-size: 12px; margin-top: 2px; line-height: 1.5; }
      .sw { width: 46px; height: 26px; border-radius: 99px; background: #334155; position: relative; flex-shrink: 0; transition: background .15s; }
      .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #cbd5e1; transition: transform .15s, background .15s; }
      .sw.on { background: #34d399; }
      .sw.on::after { transform: translateX(20px); background: #020617; }
      .player { display: flex; flex-direction: column; min-height: 100vh; }
      .phead { display: flex; align-items: center; gap: 10px; padding: 12px; max-width: 520px; margin: 0 auto; width: 100%; }
      .phead .t { flex: 1; min-width: 0; }
      .phead .wn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 28px; text-align: center; }
      .roundbadge { font-size: 16px; color: #a5b4fc; }
      .tt { font-size: 14px; color: #cbd5e1; font-variant-numeric: tabular-nums; }
      .pmid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 20px; }
      .ringwrap { position: relative; width: 224px; height: 224px; }
      .ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .rem { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .cur { font-size: 26px; font-weight: 800; text-align: center; }
      .subtxt { color: #cbd5e1; font-size: 16px; margin-top: 6px; }
      .roundtitle { color: #f1f5f9; font-size: 20px; margin-bottom: 8px; font-weight: 700; text-align: center; }
      .next { font-size: 18px; color: #f1f5f9; margin-top: 12px; text-align: center; }
      .next b { color: #6ee7b7; }
      .pbar { padding: 0 24px; max-width: 520px; margin: 0 auto; width: 100%; }
      .pinfo { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; min-height: 18px; }
      .pinfo .tt { margin-left: auto; color: #cbd5e1; font-size: 14px; }
      .pbar .track { height: 6px; background: #1e293b; border-radius: 99px; overflow: hidden; }
      .pbar .fill { height: 100%; background: #34d399; border-radius: 99px; width: 0%; }
      .ctrls { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
      .cbtn { background: #1e293b; color: #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      .cbtn.md { width: 56px; height: 56px; }
      .cbtn.md svg { width: 24px; height: 24px; }
      .cbtn.big { width: 76px; height: 76px; background: #34d399; color: #020617; }
      .cbtn.big svg { width: 32px; height: 32px; }
      .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; min-height: 100vh; }
      .done h2 { font-size: 30px; }
      .done .emoji { font-size: 56px; }
      .done .meta { color: #94a3b8; }
      .done .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .ghost { background: #1e293b; color: #e2e8f0; border-radius: 12px; padding: 12px 20px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Zet JavaScript aan om de Workout Timer te gebruiken.</noscript>
    <script>
      (function () {
        "use strict";

        /* ---------- helpers ---------- */
        var KEY = "homeWorkoutTimer.pwa.v1";
        var SKEY = "homeWorkoutTimer.settings.v1";
        function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
        function fmt(s) { var t = Math.round(Math.max(0, s)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
        function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

        var IC = {
          play: "M8 5v14l11-7z",
          pause: "M7 5h4v14H7zM13 5h4v14h-4z",
          skip: "M6 5v14l8-7zM15 5h3v14h-3z",
          x: "M18 6L6 18M6 6l12 12",
          plus: "M12 5v14M5 12h14",
          up: "M12 19V5M5 12l7-7 7 7",
          down: "M12 5v14M5 12l7 7 7-7",
          trash: "M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14",
          copy: "M9 9h11v11H9zM5 15V4h11",
          back: "M19 12H5M12 19l-7-7 7-7",
          pencil: "M16 4l4 4L8 20H4v-4L16 4z",
          save: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM12 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM7 3v6h8V3z",
          sliders: "M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"
        };
        function svgF(d, c) { return '<svg class="' + (c || "") + '" viewBox="0 0 24 24" fill="currentColor"><path d="' + d + '"/></svg>'; }
        function svgS(d, c) { return '<svg class="' + (c || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>'; }

        /* ---------- data ---------- */
        function seeds() {
          return [
            {
              id: uid(), name: "Full Body HIIT",
              blocks: [
                { id: uid(), kind: "round", name: "Ronde", reps: 3, rest: 30, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "Jumping jacks", active: 40, rest: 10 },
                { id: uid(), kind: "exercise", name: "Push-ups", active: 30, rest: 15 },
                { id: uid(), kind: "exercise", name: "Squats", active: 40, rest: 15 },
                { id: uid(), kind: "exercise", name: "Plank", active: 45, rest: 0 }
              ]
            },
            {
              id: uid(), name: "Tabata Quickie",
              blocks: [
                { id: uid(), kind: "round", name: "Tabata", reps: 4, rest: 20, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "Burpees", active: 20, rest: 10 },
                { id: uid(), kind: "exercise", name: "High knees", active: 20, rest: 10 }
              ]
            },
            {
              id: uid(), name: "25-min Low Impact (yoga mat)",
              blocks: [
                { id: uid(), kind: "round", name: "Warm-up", reps: 1, rest: 0, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "March in place + arm swings", active: 60, rest: 0 },
                { id: uid(), kind: "exercise", name: "Cat-cow + hip circles", active: 60, rest: 0 },
                { id: uid(), kind: "exercise", name: "Shoulder pull-aparts (loop band)", active: 60, rest: 0 },
                { id: uid(), kind: "round", name: "Conditioning", reps: 2, rest: 60, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "Side-step jacks (band enkels)", active: 40, rest: 20 },
                { id: uid(), kind: "exercise", name: "Squat + overhead press (lange band)", active: 40, rest: 20 },
                { id: uid(), kind: "exercise", name: "High-knee marches", active: 40, rest: 20 },
                { id: uid(), kind: "exercise", name: "Seated row sprint (lange band)", active: 40, rest: 20 },
                { id: uid(), kind: "round", name: "Strength", reps: 2, rest: 20, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "Goblet squat (duikgewicht)", active: 45, rest: 15 },
                { id: uid(), kind: "exercise", name: "Glute bridge (gewicht op heupen)", active: 45, rest: 15 },
                { id: uid(), kind: "exercise", name: "Seated band row", active: 45, rest: 15 },
                { id: uid(), kind: "exercise", name: "Lateral walks (loop band)", active: 45, rest: 15 },
                { id: uid(), kind: "round", name: "Core finisher", reps: 1, rest: 0, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "Plank + shoulder taps", active: 45, rest: 10 },
                { id: uid(), kind: "exercise", name: "Dead bug", active: 45, rest: 0 },
                { id: uid(), kind: "round", name: "Cooldown", reps: 1, rest: 0, restAfterLast: 0 },
                { id: uid(), kind: "exercise", name: "Hamstring/hip/chest stretch + diep ademen", active: 120, rest: 0 }
              ]
            }
          ];
        }

        function buildSegments(blocks) {
          var out = [];
          var i = 0;
          while (i < blocks.length) {
            var b = blocks[i];
            if (b.kind === "round") {
              var group = [];
              var j = i + 1;
              while (j < blocks.length && blocks[j].kind === "exercise") { group.push(blocks[j]); j++; }
              var inner = buildSegments(group);
              i = j;
              if (inner.length === 0) continue;
              var reps = Math.max(1, b.reps);
              for (var r = 1; r <= reps; r++) {

                for (var k = 0; k < inner.length; k++) {
                  out.push(Object.assign({}, inner[k], { round: r, rounds: reps, roundName: b.name }));
                }
                if (r < reps && b.rest > 0) {
                  out.push({ kind: "roundRest", label: b.name + " — pauze", seconds: b.rest, round: r, rounds: reps, roundName: b.name });
                }
                if (r === reps && (b.restAfterLast || 0) > 0) {
                  out.push({ kind: "roundRest", label: b.name + " — pauze na ronde", seconds: b.restAfterLast, round: r, rounds: reps, roundName: b.name });
                }
              }
            } else {
              out.push({ kind: "active", label: b.name || "Oefening", seconds: Math.max(1, b.active) });
              if (b.rest > 0) out.push({ kind: "rest", label: "Pauze", seconds: b.rest });
              i++;
            }
          }
          return out;
        }

        /* ---------- sound ---------- */
        var actx = null;
        function getCtx() {
          if (!actx) {
            try {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (AC) actx = new AC();
            } catch (e) {}
          }
          return actx;
        }
        function tone(freq, delay, dur, gain) {
          var c = getCtx();
          if (!c) return;
          var v = (gain || 1.0) * settings.volume;
          if (v <= 0.001) return;
          try {
            if (c.state === "suspended") c.resume();
            var t = c.currentTime + delay;
            var o = c.createOscillator();
            var g = c.createGain();
            o.type = "sine";
            o.frequency.value = freq;
            g.gain.setValueAtTime(v, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g);
            g.connect(c.destination);
            o.start(t);
            o.stop(t + dur + 0.05);
          } catch (e) {}
        }
        var SOUNDS = {
          bel: { name: "Bel", desc: "heldere dubbelbel", play: function () { tone(880, 0, 0.3); tone(1318, 0.03, 0.4, 0.15); } },
          piep: { name: "Piep", desc: "kort dubbel piepen", play: function () { tone(1000, 0, 0.15, 0.34); tone(1000, 0.22, 0.15, 0.34); } },
          gong: { name: "Beep", desc: "race countdown beep", play: function () { tone(1318, 0, 0.08, 0.5); tone(1568, 0.1, 0.08, 0.5); tone(2093, 0.2, 0.12, 0.5); } }
        };
        function notify() { (SOUNDS[settings.sound] || SOUNDS.bel).play(); }
        function tick() { tone(1500, 0, 0.08, 0.4); }
        function endBell() { tone(660, 0, 0.25, 0.5); tone(660, 0.3, 0.25, 0.5); tone(990, 0.6, 0.6, 0.5); }

        /* ---------- state ---------- */
        function migrateWorkout(w) {
          if (!w || !w.blocks) return false;
          var changed = false;
          var blocks = [];
          for (var i = 0; i < w.blocks.length; i++) {
            var b = w.blocks[i];
            if (b.kind === "pause") {
              changed = true;
            } else {
              if (b.kind === "round" && b.restAfterLast === undefined) {
                b.restAfterLast = 0;
                changed = true;
              }
              blocks.push(b);
            }
          }
          w.blocks = blocks;
          return changed;
        }
        var workouts = (function () {
          try {
            var raw = localStorage.getItem(KEY);
            if (raw) {
              var ws = JSON.parse(raw);
              if (ws) {
                var changed = false;
                for (var i = 0; i < ws.length; i++) changed = migrateWorkout(ws[i]) || changed;
                if (changed) { try { localStorage.setItem(KEY, JSON.stringify(ws)); } catch (e2) {} }
                return ws;
              }
            }
          } catch (e) {}
          return seeds();
        })();
        var settings = (function () {
          var d = { volume: 0.8, sound: "bel", countStart: true, countEnd: true };
          try {
            var raw = localStorage.getItem(SKEY);
            if (raw) {
              var s = JSON.parse(raw);
              if (s) {
                var v = Number(s.volume);
                if (v >= 0 && v <= 1) d.volume = v;
                if (["bel", "piep", "gong"].indexOf(s.sound) >= 0) d.sound = s.sound;
                if (s.countStart === false) d.countStart = false;
                if (s.countEnd === false) d.countEnd = false;
              }
            }
          } catch (e) {}
          return d;
        })();
        function saveSettings() { try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {} }
        var view = { name: "list" };
        var dirty = false;

        function save() { try { localStorage.setItem(KEY, JSON.stringify(workouts)); } catch (e) {} dirty = false; updateSaveBtn(); }
        function markDirty() { dirty = true; updateSaveBtn(); }
        function updateSaveBtn() { var btn = document.getElementById("saveBtn"); if (btn) btn.style.display = dirty ? "inline-flex" : "none"; }
        function findW(id) { for (var i = 0; i < workouts.length; i++) if (workouts[i].id === id) return workouts[i]; return null; }
        function findBlock(id) {
          var w = findW(view.id);
          if (!w) return null;
          for (var i = 0; i < w.blocks.length; i++) if (w.blocks[i].id === id) return w.blocks[i];
          return null;
        }

        var P = {
          segs: [], totalSec: 0, idx: 0, running: false, finished: false,
          elapsedRef: 0, startAt: 0, lastTick: null, timer: null, lock: null
        };

        var app = document.getElementById("app");

        /* ---------- silent updates (no re-render, keeps input focus) ---------- */
        function silentBlock(id, patch) {
          var b = findBlock(id);
          if (!b) return;
          Object.assign(b, patch);
          markDirty();
          syncNums();
          updateStats();
        }
        function syncNums() {
          var els = document.querySelectorAll("[data-num]");
          for (var i = 0; i < els.length; i++) {
            var parts = els[i].getAttribute("data-num").split(":");
            var b = findBlock(parts[0]);
            if (b) els[i].value = b[parts[1]];
          }
        }
        function updateStats() {
          var w = findW(view.id);
          if (!w) return;
          var segs = buildSegments(w.blocks);
          var total = 0;
          for (var i = 0; i < segs.length; i++) total += segs[i].seconds;
          var t = document.getElementById("statTot");
          if (t) t.textContent = fmt(total);
          var c = document.getElementById("statSeg");
          if (c) c.textContent = segs.length;
          var sb = document.getElementById("startBtn");
          if (sb) sb.disabled = segs.length === 0;
        }

        /* ---------- stepper hold ---------- */
        var holdT = null, repT = null;
        function stepStop() {
          if (holdT) { clearTimeout(holdT); holdT = null; }
          if (repT) { clearInterval(repT); repT = null; }
        }
        function stepStart(id, field, delta) {
          stepStop();
          var doStep = function () {
            var b = findBlock(id);
            if (!b) return;
            var v = Math.max(0, (b[field] || 0) + delta);
            silentBlock(id, { [field]: v });
          };
          doStep();
          holdT = setTimeout(function () { repT = setInterval(doStep, 100); }, 400);
        }

        /* ---------- wake lock ---------- */
        function acquireLock() {
          try {
            if ("wakeLock" in navigator) {
              navigator.wakeLock.request("screen").then(function (l) { P.lock = l; }).catch(function () {});
            }
          } catch (e) {}
        }
        function releaseLock() {
          try { if (P.lock) P.lock.release(); } catch (e) {}
          P.lock = null;
        }

        /* ---------- player ---------- */
        function startTimer() { stopTimer(); P.timer = setInterval(onTick, 100); }
        function stopTimer() { if (P.timer) { clearInterval(P.timer); P.timer = null; } }

        function onTick() {
          var seg = P.segs[P.idx];
          if (!seg) return;
          var el = P.elapsedRef + (Date.now() - P.startAt);
          var remMs = seg.seconds * 1000 - el;
          if (remMs > 0) {
            paintTick(remMs);
            var secLeft = Math.ceil(remMs / 1000);
            var wantTick = seg.kind === "active" ? settings.countEnd : settings.countStart;
            if (wantTick && secLeft <= 3 && secLeft >= 1 && P.lastTick !== secLeft) { P.lastTick = secLeft; tick(); }
          } else {
            advance();
          }
        }

        function advance() {
          P.lastTick = null;
          P.elapsedRef = 0;
          if (P.idx >= P.segs.length - 1) {
            stopTimer();
            P.running = false;
            P.finished = true;
            releaseLock();
            endBell();
            render();
          } else {
            P.idx++;
            P.startAt = Date.now();
            notify();
            render();
          }
        }

        function paintTick(remMs) {
          var seg = P.segs[P.idx];
          var segMs = seg.seconds * 1000;
          var el = segMs - remMs;
          var rem = document.getElementById("rem");
          if (!rem) return;
          rem.textContent = fmt(Math.ceil(remMs / 1000));
          var ring = document.getElementById("ringFg");
          if (ring) ring.style.strokeDashoffset = String(552.92 * (remMs / segMs));
          var doneSec = 0;
          for (var i = 0; i < P.idx; i++) doneSec += P.segs[i].seconds;
          var overall = (doneSec * 1000 + el) / (P.totalSec * 1000 || 1);
          var bar = document.getElementById("bar");
          if (bar) bar.style.width = (overall * 100).toFixed(1) + "%";
          var tt = document.getElementById("tt");
          if (tt) tt.textContent = fmt(doneSec + el / 1000) + " / " + fmt(P.totalSec);
        }

        function nextActiveAfter(idx) {
          for (var j = idx + 1; j < P.segs.length; j++) {
            if (P.segs[j].kind === "active") return P.segs[j];
          }
          return null;
        }

        /* ---------- renders ---------- */
        function render() {
          stepStop();
          if (view.name === "list") renderList();
          else if (view.name === "edit") renderEditor();
          else if (view.name === "preview") renderPreview();
          else if (view.name === "settings") renderSettings();
          else renderPlayer();
        }

        function renderList() {
          var html = '<div class="wrap"><div class="head"><div><h1>&#128170; Workout Timer</h1><div class="sub">Bouw je workout, doe hem met bel &amp; afcount.</div></div>' +
            '<div class="headbtns"><button class="ibtn" title="Instellingen" onclick="App.openSettings()">' + svgS(IC.sliders) + '</button>' +
            '<button class="btn" onclick="App.create()">' + svgS(IC.plus) + ' Nieuwe workout</button></div></div>';
          if (workouts.length === 0) {
            html += '<p class="empty">Nog geen workouts. Maak er &eacute;&eacute;n aan om te beginnen.</p>';
          }
          for (var i = 0; i < workouts.length; i++) {
            var w = workouts[i];
            var segs = buildSegments(w.blocks);
            var total = 0;
            for (var k = 0; k < segs.length; k++) total += segs[k].seconds;
            var ex = 0, rd = 0;
            for (var n = 0; n < w.blocks.length; n++) {
              if (w.blocks[n].kind === "exercise") ex++;
              else if (w.blocks[n].kind === "round") rd++;
            }
            html += '<div class="wcard">' +
              '<button class="playbtn" onclick="App.play(\'' + w.id + '\')" title="Starten">' + svgF(IC.play) + '</button>' +
              '<button class="wname" onclick="App.edit(\'' + w.id + '\')">' +
                '<div class="t">' + esc(w.name) + '</div>' +
                '<div class="meta">' + ex + ' oefeningen' + (rd > 0 ? " &middot; " + rd + " ronde" + (rd > 1 ? "n" : "") : "") + " &middot; &#9201; " + fmt(total) + '</div>' +
              '</button>' +
              '<button class="ibtn" title="Bewerken" onclick="App.edit(\'' + w.id + '\')">' + svgS(IC.pencil) + '</button>' +
              '<button class="ibtn" title="Dupliceren" onclick="App.dup(\'' + w.id + '\')">' + svgS(IC.copy) + '</button>' +
              '<button class="ibtn" title="Verwijderen" onclick="App.del(\'' + w.id + '\')">' + svgS(IC.trash) + '</button>' +
              '</div>';
          }
          html += "</div>";
          app.innerHTML = html;
        }

        function fieldHtml(id, label, field, step) {
          var b = findBlock(id);
          var v = b ? (b[field] || 0) : 0;
          return '<div class="field"><span class="flabel">' + label + '</span><div class="stepper">' +
            '<button onpointerdown="App.stepStart(\'' + id + '\',\'' + field + '\',' + (-step) + ')" onpointerup="App.stepStop()" onpointerleave="App.stepStop()" onpointercancel="App.stepStop()">&minus;</button>' +
            '<input data-num="' + id + ":" + field + '" type="number" min="0" inputmode="numeric" value="' + v + '" oninput="App.setNum(\'' + id + '\',\'' + field + '\',this.value)">' +
            '<button onpointerdown="App.stepStart(\'' + id + '\',\'' + field + '\',' + step + ')" onpointerup="App.stepStop()" onpointerleave="App.stepStop()" onpointercancel="App.stepStop()">+</button>' +
            "</div></div>";
        }

        function renderEditor() {
          var w = findW(view.id);
          if (!w) { view = { name: "list" }; renderList(); return; }
          var segs = buildSegments(w.blocks);
          var total = 0;
          for (var k = 0; k < segs.length; k++) total += segs[k].seconds;
          var containers = document.querySelectorAll(".addContainer");
          for (var c = 0; c < containers.length; c++) containers[c].remove();

          var html = '<div class="topbar"><div class="in">' +
            '<button class="ibtn" title="Terug" onclick="App.back()">' + svgS(IC.back) + '</button>' +
            '<input class="winput" value="' + esc(w.name) + '" oninput="App.rename(this.value)" />' +
            '<button class="btn" id="saveBtn" onclick="App.save()"' + (dirty ? '' : ' style="display:none"') + '>' + svgS(IC.save) + ' Opslaan</button>' +
            '<button class="btn" id="startBtn" ' + (segs.length === 0 ? "disabled" : "") + ' onclick="App.startWorkout()">' + svgF(IC.play) + ' Start</button>' +
            "</div></div><div class=\"wrap\">" +
            '<div class="stats"><span>&#9201; totaal <b id="statTot">' + fmt(total) + "</b> &middot; <span id=\"statSeg\">" + segs.length + '</span> segmenten</span></div>';

          for (var i = 0; i < w.blocks.length; i++) {
            var b = w.blocks[i];
            var isRound = b.kind === "round";
            var cls = isRound ? "round" : "";
            var badge = isRound ? "Ronde &times;" : "Oefening";
            var bcls = isRound ? "rd" : "ex";
            html += '<div class="block ' + cls + '" data-block-id="' + b.id + '">' +
              '<div class="card-top">' +
              '<span class="badge ' + bcls + '">' + badge + "</span>" +
              '<textarea class="bname" rows="3" oninput="App.setName(\'' + b.id + '\',this.value)">' + esc(b.name) + '</textarea>' +
              '<button class="ibtn dup-btn" title="Dupliceren" onclick="App.dupBlock(\'' + b.id + '\')">' + svgS(IC.copy) + "</button>" +
              '<button class="ibtn del-btn" title="Verwijderen" onclick="App.delBlock(\'' + b.id + '\')">' + svgS(IC.trash) + "</button>" +
              "</div>" +
              '<div class="card-bot"><div class="fields">';
            if (isRound) {
              html += '<div class="round-fields">' +
                '<div class="round-row">' +
                  fieldHtml(b.id, "herhalingen", "reps", 1) +
                  fieldHtml(b.id, "pauze tussen (s)", "rest", 5) +
                '</div>' +
                '<div class="round-row">' +
                  fieldHtml(b.id, "pauze na ronde (s)", "restAfterLast", 5) +
                '</div>' +
              '</div>';
            } else {
              html += fieldHtml(b.id, "actief (s)", "active", 5);
              html += fieldHtml(b.id, "pauze (s)", "rest", 5);
            }
            html += "</div>" +
              '<div class="moves">' +
              '<button class="ibtn" title="Omhoog" ' + (i === 0 ? "disabled" : "") + ' onclick="App.move(\'' + b.id + '\',-1)">' + svgS(IC.up) + "</button>" +
              '<button class="ibtn" title="Omlaag" ' + (i === w.blocks.length - 1 ? "disabled" : "") + ' onclick="App.move(\'' + b.id + '\',1)">' + svgS(IC.down) + "</button>" +
              '<button class="ibtn" title="Voeg toe na dit blok" onclick="App.addAfter(\'' + b.id + '\')">' + svgS(IC.plus) + "</button>" +
              "</div></div></div>";
          }

          html += '<div class="adds">' +
            '<button class="add ex" onclick="App.addExercise()">' + svgS(IC.plus) + ' Oefening</button>' +
            '<button class="add rd" onclick="App.addRound()">' + svgS(IC.plus) + ' Ronde &times;</button>' +
            "</div>" +
            '<p class="hint"><b>Ronde-blok:</b> herhaalt de oefeningen die eronder staan het opgegeven aantal keren. <b>Pauze tussen herhalingen:</b> rusttijd tussen elke herhaling. <b>Pauze na laatste herhaling:</b> extra rusttijd na de laatste herhaling (handig voor rust voor de volgende ronde). Tip: een ronde met 1 herhaling gebruik je als sectielabel (Warm-up, Cooldown). Tijdens de training hoor je een meldingsgeluid bij elke wissel en eventueel afcount-piepjes &mdash; stel het volume en de geluiden in via <b>Instellingen</b>.</p></div>';
          app.innerHTML = html;
        }

        function renderPreview() {
          var w = findW(view.id);
          if (!w) { view = { name: "list" }; renderList(); return; }
          var segs = buildSegments(w.blocks);
          var total = 0;
          for (var k = 0; k < segs.length; k++) total += segs[k].seconds;
          var ex = 0, rd = 0;
          for (var n = 0; n < w.blocks.length; n++) {
            if (w.blocks[n].kind === "exercise") ex++;
            else if (w.blocks[n].kind === "round") rd++;
          }

          var html = '<div class="topbar"><div class="in">' +
            '<button class="ibtn" title="Terug" onclick="App.back()">' + svgS(IC.back) + '</button>' +
            '<div class="pvhead"><div class="t">' + esc(w.name) + '</div>' +
            '<div class="meta">' + ex + ' oefeningen' + (rd > 0 ? ' &middot; ' + rd + ' ronde' + (rd > 1 ? 'n' : '') : '') + ' &middot; &#9201; ' + fmt(total) + ' &middot; ' + segs.length + ' segmenten</div></div>' +
            '<button class="btn" ' + (segs.length === 0 ? "disabled" : "") + ' onclick="App.begin()">' + svgF(IC.play) + ' Start</button>' +
            "</div></div><div class=\"wrap\">";

          if (w.blocks.length === 0) {
            html += '<p class="empty">Deze workout is nog leeg &mdash; voeg oefeningen toe in de editor.</p>';
          } else {
            html += '<div class="pv">';
            var inRound = false;
            for (var i = 0; i < w.blocks.length; i++) {
              var b = w.blocks[i];
              if (b.kind === "round") {
                inRound = true;
                var meta = [Math.max(1, b.reps) + "&times;"];
                if (b.rest > 0) meta.push("pauze tussen herhalingen " + b.rest + "s");
                if ((b.restAfterLast || 0) > 0) meta.push("pauze na ronde " + b.restAfterLast + "s");
                html += '<div class="pv-round"><span class="badge rd">Ronde</span><span class="nm">' + esc(b.name) + '</span><span class="mt">' + meta.join(" &middot; ") + '</span></div>';
              } else {
                var t = Math.max(1, b.active || 0) + "s";
                if (b.rest > 0) t += " + " + b.rest + "s pauze";
                html += '<div class="pv-row' + (inRound ? " in" : "") + '"><span class="nm">' + esc(b.name) + '</span><span class="mt">' + t + '</span></div>';
              }
            }
            html += "</div>";
          }
          html += '<p class="hint">Druk op <b>Start</b> bovenaan om de workout te beginnen.</p></div>';
          app.innerHTML = html;
        }

        function renderSettings() {
          var html = '<div class="topbar"><div class="in">' +
            '<button class="ibtn" title="Terug" onclick="App.back()">' + svgS(IC.back) + '</button>' +
            '<div class="pvhead"><div class="t">Instellingen</div></div>' +
            "</div></div>" +
            '<div class="wrap">' +
            '<div class="setgroup"><div class="settitle">Volume</div>' +
            '<div class="volrow"><input type="range" min="0" max="100" step="5" value="' + Math.round(settings.volume * 100) + '" oninput="App.setVol(this.value)">' +
            '<span class="volval" id="volVal">' + Math.round(settings.volume * 100) + '%</span>' +
            '<button class="ibtn" title="Luister" onclick="App.testSound()">' + svgF(IC.play) + "</button></div></div>" +
            '<div class="setgroup"><div class="settitle">Meldingsgeluid</div><div class="sopts">';
          var ids = ["bel", "piep", "beep"];
          for (var i = 0; i < ids.length; i++) {
            var id = ids[i];
            var s = SOUNDS[id] || SOUNDS.gong;
            var sel = settings.sound === id || (id === "beep" && settings.sound === "gong");
            html += '<button class="sopt' + (sel ? " sel" : "") + '" onclick="App.setSound(\'' + id + '\')">' +
              '<span class="stxt"><span class="sn">' + s.name + '</span><span class="sd">' + s.desc + "</span></span>" +
              (sel ? '<span class="check">&#10003;</span>' : "") + "</button>";
          }
          html += "</div></div>" +
            '<div class="setgroup"><div class="settitle">Aftellen</div>' +
            '<button class="setrow" onclick="App.toggleCount(\'countStart\')">' +
            '<div class="settxt"><div class="l">Aftellen bij start</div><div class="d">Piepjes in de laatste 3 seconden v&oacute;&oacute;r het begin van een oefening (tijdens rust of pauze)</div></div>' +
            '<span class="sw' + (settings.countStart ? " on" : "") + '"></span></button>' +
            '<button class="setrow" onclick="App.toggleCount(\'countEnd\')">' +
            '<div class="settxt"><div class="l">Aftellen bij einde</div><div class="d">Piepjes in de laatste 3 seconden van elke actieve oefening</div></div>' +
            '<span class="sw' + (settings.countEnd ? " on" : "") + '"></span></button>' +
            "</div>" +
            '<p class="hint">Het meldingsgeluid klinkt bij elke wissel van blok. Met <b>Luister</b> hoor je een voorbeeld op het gekozen volume.</p></div>';
          app.innerHTML = html;
        }

        function renderPlayer() {
          var w = findW(view.id);
          if (!w || P.segs.length === 0) {
            app.innerHTML = '<div class="done"><p class="subtxt">Deze workout heeft nog geen oefeningen.</p><button class="ghost" onclick="App.stop()">Terug naar editor</button></div>';
            return;
          }
          if (P.finished) {
            app.innerHTML = '<div class="done"><div class="emoji">&#127881;</div><h2>Klaar!</h2>' +
              '<p class="meta">' + esc(w.name) + " &middot; " + fmt(P.totalSec) + " volbracht</p>" +
              '<div class="row"><button class="btn" onclick="App.restart()">' + svgF(IC.play) + ' Nog een keer</button>' +
              '<button class="ghost" onclick="App.stop()">Terug naar editor</button></div></div>';
            return;
          }
          var seg = P.segs[P.idx];
          var isPause = seg.kind !== "active";
          var color = isPause ? "#fbbf24" : "#34d399";
          var next = nextActiveAfter(P.idx);
          var nextHtml = next
            ? "Hierna: <b>" + esc(next.label) + "</b> &middot; " + fmt(next.seconds)
            : '<span class="subtxt">Laatste blok &mdash; bijna klaar!</span>';

          var html = '<div class="player"><div class="phead"><div class="t">' +
            '<div class="wn">' + esc(w.name) + "</div>" +
            "</div></div>" +
            '<div class="pmid">' +
            (seg.round != null && seg.rounds > 1 ? '<div class="roundtitle">' + esc(seg.roundName) + ' — Ronde ' + seg.round + ' van ' + seg.rounds + '</div>' : "") +
            '<div class="ringwrap">' +
            '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#1e293b" stroke-width="10"/>' +
            '<circle id="ringFg" cx="100" cy="100" r="88" fill="none" stroke="' + color + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="552.92" stroke-dashoffset="0"/></svg>' +
            '<div class="rem" id="rem" style="color:' + color + '">' + fmt(seg.seconds) + "</div></div>" +
            "<div><div class=\"cur\" style=\"color:" + color + '">' + esc(seg.label) + "</div>" +

            (isPause && seg.label === "Pauze" ? '<div class="subtxt">Even op adem komen&hellip;</div>' : "") +
            (isPause && seg.label.indexOf("pauze na ronde") >= 0 ? '<div class="subtxt">Extra rust voor de volgende ronde&hellip;</div>' : "") +

            '<div class="next">' + nextHtml + "</div></div></div>" +
            '<div class="pbar"><div class="pinfo">' +
            (seg.round != null && seg.rounds > 1 ? '<span class="roundbadge">Ronde ' + seg.round + "/" + seg.rounds + "</span>" : "") +
            '<span class="tt" id="tt"></span></div>' +
            '<div class="track"><div class="fill" id="bar"></div></div></div>' +
            '<div class="ctrls">' +
            '<button class="cbtn md" title="Stoppen" onclick="App.stop()">' + svgS(IC.x) + "</button>" +
            '<button class="cbtn big" title="' + (P.running ? "Pauze" : "Start") + '" onclick="App.toggle()">' + (P.running ? svgF(IC.pause) : svgF(IC.play)) + "</button>" +
            '<button class="cbtn md" title="Volgende blok" onclick="App.skip()">' + svgF(IC.skip) + "</button>" +
            "</div></div>";
          app.innerHTML = html;
          var el = P.elapsedRef + (P.running ? Date.now() - P.startAt : 0);
          paintTick(Math.max(50, seg.seconds * 1000 - el));
        }

        /* ---------- actions ---------- */
        var App = {
          edit: function (id) { view = { name: "edit", id: id }; render(); },
          back: function () {
            if (view.name === "preview") {
              if (view.from === "edit") { view = { name: "edit", id: view.id }; render(); return; }
              view = { name: "list" }; render(); return;
            }
            if (view.name === "settings") { view = { name: "list" }; render(); return; }
            save();
            view = { name: "list" };
            render();
          },
          save: function () { save(); },
          openSettings: function () { view = { name: "settings" }; render(); },
          setVol: function (v) {
            settings.volume = Math.max(0, Math.min(1, (parseInt(v) || 0) / 100));
            saveSettings();
            var lab = document.getElementById("volVal");
            if (lab) lab.textContent = Math.round(settings.volume * 100) + "%";
          },
          setSound: function (id) {
            if (!SOUNDS[id] && id !== "beep") return;
            settings.sound = (id === "beep" ? "gong" : id);
            saveSettings();
            render();
            notify();
          },
          toggleCount: function (k) {
            if (k !== "countStart" && k !== "countEnd") return;
            settings[k] = !settings[k];
            saveSettings();
            render();
          },
          testSound: function () { notify(); setTimeout(tick, 450); },
          create: function () {
            var w = {
              id: uid(),
              name: "Nieuwe workout",
              blocks: [{ id: uid(), kind: "exercise", name: "Oefening 1", active: 40, rest: 20 }]
            };
            workouts.unshift(w);
            save();
            view = { name: "edit", id: w.id };
            render();
          },
          dup: function (id) {
            var src = findW(id);
            if (!src) return;
            var copy = { id: uid(), name: src.name + " (kopie)", blocks: src.blocks.map(function (b) { return Object.assign({}, b, { id: uid() }); }) };
            workouts.unshift(copy);
            save();
            render();
          },
          del: function (id) {
            workouts = workouts.filter(function (w) { return w.id !== id; });
            save();
            render();
          },
          rename: function (v) { var w = findW(view.id); if (w) { w.name = v; markDirty(); } },
          setName: function (id, v) { silentBlock(id, { name: v }); },
          setNum: function (id, field, v) { silentBlock(id, { [field]: Math.max(0, parseInt(v) || 0) }); },
          stepStart: stepStart,
          stepStop: stepStop,
          move: function (id, dir) {
            var w = findW(view.id);
            if (!w) return;
            var from = -1;
            for (var i = 0; i < w.blocks.length; i++) if (w.blocks[i].id === id) from = i;
            var to = from + dir;
            if (from < 0 || to < 0 || to >= w.blocks.length) return;
            var m = w.blocks.splice(from, 1)[0];
            w.blocks.splice(to, 0, m);
            markDirty();
            render();
          },
          delBlock: function (id) {
            var w = findW(view.id);
            if (!w) return;
            w.blocks = w.blocks.filter(function (b) { return b.id !== id; });
            markDirty();
            render();
          },
          dupBlock: function (id) {
            var w = findW(view.id);
            if (!w) return;
            var idx = -1;
            for (var i = 0; i < w.blocks.length; i++) {
              if (w.blocks[i].id === id) { idx = i; break; }
            }
            if (idx < 0) return;
            var b = w.blocks[idx];
            var copy = Object.assign({}, b, { id: uid() });
            if (b.kind === "exercise") {
              copy.name = b.name + " (kopie)";
            } else if (b.kind === "round") {
              copy.name = b.name + " (kopie)";
            }
            w.blocks.splice(idx + 1, 0, copy);
            markDirty();
            render();
          },
          addExercise: function () {
            var w = findW(view.id);
            if (!w) return;
            var n = 1;
            for (var i = 0; i < w.blocks.length; i++) if (w.blocks[i].kind === "exercise") n++;
            w.blocks.push({ id: uid(), kind: "exercise", name: "Oefening " + n, active: 40, rest: 20 });
            markDirty();
            render();
          },
          addRound: function () {
            var w = findW(view.id);
            if (!w) return;
            w.blocks.push({ id: uid(), kind: "round", name: "Ronde", reps: 3, rest: 30, restAfterLast: 0 });
            markDirty();
            render();
          },
          addAfter: function (id) {
            var w = findW(view.id);
            if (!w) return;
            var idx = -1;
            for (var i = 0; i < w.blocks.length; i++) {
              if (w.blocks[i].id === id) { idx = i; break; }
            }
            if (idx < 0) return;
            var exCount = 0, rdCount = 0;
            for (var i = 0; i < w.blocks.length; i++) {
              if (w.blocks[i].kind === "exercise") exCount++;
              else if (w.blocks[i].kind === "round") rdCount++;
            }
            var newExName = "Oefening " + (exCount + 1);
            var newRdName = "Ronde " + (rdCount + 1);
            var html = '<div class="adds inline" id="addAfter-' + id + '">' +
              '<button class="add ex" onclick="App.insertExercise(\'' + id + '\',\'' + newExName + '\')">' + svgS(IC.plus) + ' Oefening</button>' +
              '<button class="add rd" onclick="App.insertRound(\'' + id + '\',\'' + newRdName + '\')">' + svgS(IC.plus) + ' Ronde</button>' +
              '<button class="ibtn" onclick="App.cancelAdd()">' + svgS(IC.x) + '</button>' +
              '</div>';
            var container = document.createElement("div");
            container.className = "addContainer";
            container.innerHTML = html;
            var blockEl = document.querySelector('[data-block-id="' + id + '"]');
            if (blockEl) blockEl.parentNode.insertBefore(container, blockEl.nextSibling);
          },
          insertExercise: function (afterId, name) {
            var w = findW(view.id);
            if (!w) return;
            var idx = -1;
            for (var i = 0; i < w.blocks.length; i++) {
              if (w.blocks[i].id === afterId) { idx = i; break; }
            }
            if (idx < 0) return;
            w.blocks.splice(idx + 1, 0, { id: uid(), kind: "exercise", name: name, active: 40, rest: 20 });
            markDirty();
            render();
          },
          insertRound: function (afterId, name) {
            var w = findW(view.id);
            if (!w) return;
            var idx = -1;
            for (var i = 0; i < w.blocks.length; i++) {
              if (w.blocks[i].id === afterId) { idx = i; break; }
            }
            if (idx < 0) return;
            w.blocks.splice(idx + 1, 0, { id: uid(), kind: "round", name: name, reps: 3, rest: 30, restAfterLast: 0 });
            markDirty();
            render();
          },
          cancelAdd: function () {
            var containers = document.querySelectorAll(".addContainer");
            for (var i = 0; i < containers.length; i++) {
              containers[i].remove();
            }
          },
          startWorkout: function () { save(); App.play(view.id); },
          play: function (id) {
            if (!findW(id)) return;
            view = { name: "preview", id: id, from: view.name };
            render();
          },
          begin: function () {
            var w = findW(view.id);
            if (!w) return;
            view = { name: "play", id: view.id };
            P.segs = buildSegments(w.blocks);
            P.totalSec = 0;
            for (var i = 0; i < P.segs.length; i++) P.totalSec += P.segs[i].seconds;
            P.idx = 0;
            P.running = false;
            P.finished = false;
            P.elapsedRef = 0;
            P.lastTick = null;
            stopTimer();
            render();
          },
          toggle: function () {
            if (P.finished) return;
            if (P.running) {
              P.elapsedRef += Date.now() - P.startAt;
              stopTimer();
              P.running = false;
              render();
            } else {
              if (P.elapsedRef === 0) notify();
              P.startAt = Date.now();
              P.running = true;
              startTimer();
              acquireLock();
              render();
            }
          },
          skip: function () { advance(); },
          stop: function () {
            stopTimer();
            P.running = false;
            releaseLock();
            view = { name: "edit", id: view.id };
            render();
          },
          restart: function () {
            P.idx = 0;
            P.finished = false;
            P.elapsedRef = 0;
            P.lastTick = null;
            P.running = false;
            App.toggle();
          }
        };
        window.App = App;

        render();

        /* ---------- PWA: service worker ---------- */
        if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("sw.js").catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
